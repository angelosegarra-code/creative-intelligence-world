name: Coach Studio institutional pilot checks
on:
  pull_request:
    paths:
      - 'coach-app/**'
      - '.github/workflows/coach-organization-tests.yml'
  push:
    branches: [feature/organization-workspaces-v1]
    paths:
      - 'coach-app/**'
      - '.github/workflows/coach-organization-tests.yml'
jobs:
  organization-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coach_test
          POSTGRES_PASSWORD: coach_test_password
          POSTGRES_DB: coach_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U coach_test -d coach_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: coach-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coach-app/package-lock.json
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check postgres-server.mjs
          node --check organization-routes.mjs
          node --check organization-accept.mjs
          node --check organizations.js
      - name: Unit tests
        run: node --test postgres-schema.test.mjs postgres-adapter.test.mjs organization-routes.test.mjs
      - name: PostgreSQL integration tests
        env:
          CI_ORGANIZATION_TEST_DATABASE_URL: postgresql://coach_test:coach_test_password@127.0.0.1:5432/coach_test
        run: node --test organization-postgres.integration.test.mjs
      - name: HTTP smoke test against running Coach Studio
        env:
          CI_ORGANIZATION_TEST_DATABASE_URL: postgresql://coach_test:coach_test_password@127.0.0.1:5432/coach_test
        run: node --test organization-http.smoke.test.mjs
