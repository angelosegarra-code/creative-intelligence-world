<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Organization | Creative Intelligence</title>

  <style>
    :root {
      --cream: #f5f1e8;
      --white: #ffffff;
      --ink: #17272b;
      --muted: #617076;
      --teal: #1d6267;
      --teal-dark: #15494d;
      --gold: #bd9144;
      --border: rgba(29, 98, 103, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--teal);
    }

    .hero {
      padding: 90px 0 60px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 7vw, 82px);
      line-height: 0.98;
      font-weight: 500;
      margin: 0 0 24px;
      max-width: 850px;
    }

    .intro {
      max-width: 700px;
      font-size: 19px;
      line-height: 1.65;
      color: var(--muted);
    }

    .workspace {
      padding: 10px 0 100px;
    }

    .workspace-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      font-weight: 500;
      margin: 0;
    }

    .button {
      display: inline-block;
      background: var(--teal);
      color: white;
      text-decoration: none;
      padding: 15px 22px;
      border-radius: 6px;
      font-weight: 700;
    }

    .button:hover {
      background: var(--teal-dark);
    }

    .challenge-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 34px;
      box-shadow: 0 12px 35px rgba(23, 39, 43, 0.06);
    }

    .challenge-meta {
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .challenge-card h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 500;
      margin: 0 0 18px;
    }

    .status {
      color: var(--muted);
      margin-bottom: 26px;
    }

    @media (max-width: 700px) {
      .hero {
        padding-top: 60px;
      }

      .workspace-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .challenge-card {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <div class="brand">Creative Intelligence for Business</div>
    </div>
  </header>

  <main>

    <section class="hero">
      <div class="container">

        <div class="eyebrow">
          Organizational Learning
        </div>

        <h1>
          Your organization learns by doing.
        </h1>

        <p class="intro">
          Explore important challenges, make decisions, test assumptions,
          learn from what happens, and carry that learning into what comes next.
        </p>

      </div>
    </section>

    <section class="workspace">
      <div class="container">

        <div class="workspace-head">
          <h2>Your Challenges</h2>

          <a class="button" href="new-challenge.html">
            + Start a New Challenge
          </a>
        </div>

       <div id="challenges-list"></div>

      </div>
    </section>

  </main>

 <script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXCV-KhxEoPD9L9JINUYx80Hzy2G-57ZqUV6IiyGdziIbGBLx0F0HgnCymwvrUOaa4JA/exec";

  function loadChallenges() {
    const callbackName = "receiveChallenges";

    window[callbackName] = function(data) {
      const list = document.getElementById("challenges-list");

      if (!data || !data.success || !data.challenges) {
        list.innerHTML = "<p>Could not load challenges.</p>";
        return;
      }

      const latestChallenges = Object.values(
  data.challenges.reduce((latest, item) => {
    const id = item.challenge_id;
    const iteration = Number(item.iteration || 1);

    if (
      !latest[id] ||
      iteration > Number(latest[id].iteration || 1)
    ) {
      latest[id] = item;
    }

    return latest;
  }, {})
);

list.innerHTML = latestChallenges.map((item) => {
        const iteration = Number(item.iteration || 1);
        const statusText =
          iteration > 1
            ? "Learning from the previous iteration is ready to inform what you explore next."
            : "This challenge is ready to begin its first learning cycle.";

        const buttonText =
          iteration > 1
            ? "Continue Challenge"
            : "Begin Challenge";

        return `
          <div class="challenge-card">
            <div class="challenge-meta">
              ${item.challenge_id} · Iteration ${iteration}
            </div>

            <h3>${item.challenge}</h3>

            <div class="status">
              ${statusText}
            </div>

            <a
              class="button"
             href="team-perspective.html?challenge_id=${encodeURIComponent(item.challenge_id)}&iteration=${iteration}&challenge=${encodeURIComponent(item.challenge)}"
            >
              ${buttonText}
            </a>
          </div>
        `;
      }).join("");
    };

    const script = document.createElement("script");

    script.src =
      SCRIPT_URL +
      "?type=challenges&callback=" +
      callbackName;

    document.body.appendChild(script);
  }

  loadChallenges();
    
       
  </script>
  
</body>
</html>
